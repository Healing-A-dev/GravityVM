<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#282637"/>
      <stop offset="60%" stop-color="#1B1926"/>
      <stop offset="100%" stop-color="#14121E"/>
    </radialGradient>

    <!-- Core Well Radial Glow -->
    <radialGradient id="singularityGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAB387" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#F38BA8" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#CBA6F7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1B1926" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="corePlanet" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="25%" stop-color="#F5C2E7"/>
      <stop offset="65%" stop-color="#CBA6F7"/>
      <stop offset="100%" stop-color="#897EC4"/>
    </radialGradient>

    <!-- Flow Line Gradients -->
    <linearGradient id="lineGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89DCEB" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#A6E3A1" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#F9E2AF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FAB387" stop-opacity="1.0"/>
    </linearGradient>

    <linearGradient id="lineGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94E2D5" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#89B4FA" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#CBA6F7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5C2E7" stop-opacity="1.0"/>
    </linearGradient>

    <linearGradient id="orbitGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#89DCEB" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#B4BEFE" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#CBA6F7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5E0DC"/>
      <stop offset="35%" stop-color="#CBA6F7"/>
      <stop offset="70%" stop-color="#89DCEB"/>
      <stop offset="100%" stop-color="#A6E3A1"/>
    </linearGradient>

    <!-- Soft Drop Shadow for the Celestial Sphere -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0E0C17" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" rx="32" fill="url(#bgGrad)"/>

  <!-- Subtle Ambient Glow in Center -->
  <circle cx="400" cy="245" r="190" fill="url(#singularityGlow)"/>

  <!-- Spacetime Curvature Funnel Rings (Ellipses cascading into the well) -->
  <g opacity="0.35">
    <ellipse cx="400" cy="150" rx="270" ry="42" fill="none" stroke="#74C7EC" stroke-width="1.5" stroke-dasharray="3 6"/>
    <ellipse cx="400" cy="180" rx="225" ry="34" fill="none" stroke="#89DCEB" stroke-width="1.5" stroke-dasharray="4 6"/>
    <ellipse cx="400" cy="210" rx="175" ry="26" fill="none" stroke="#A6E3A1" stroke-width="1.5"/>
    <ellipse cx="400" cy="235" rx="125" ry="18" fill="none" stroke="#F9E2AF" stroke-width="1.5"/>
    <ellipse cx="400" cy="252" rx="75" ry="11" fill="none" stroke="#FAB387" stroke-width="1.5"/>
  </g>

  <!-- Infalling Geodesic Rays / Curvature Flow Lines -->
  <!-- Left Infalling Rays -->
  <g fill="none" stroke-linecap="round">
    <!-- Outer Left Cascade -->
    <path d="M 170 120 C 190 190, 260 235, 360 252" stroke="url(#lineGradLeft)" stroke-width="2.5" opacity="0.45"/>
    <path d="M 220 95 C 245 180, 295 230, 372 254" stroke="url(#lineGradLeft)" stroke-width="3" opacity="0.65"/>
    <path d="M 280 80 C 295 165, 335 225, 382 255" stroke="url(#lineGradLeft)" stroke-width="3.5" opacity="0.85"/>
    <path d="M 340 70 C 348 150, 370 215, 390 255" stroke="url(#lineGradLeft)" stroke-width="4"/>

    <!-- Right Infalling Rays -->
    <path d="M 630 120 C 610 190, 540 235, 440 252" stroke="url(#lineGradRight)" stroke-width="2.5" opacity="0.45"/>
    <path d="M 580 95 C 555 180, 505 230, 428 254" stroke="url(#lineGradRight)" stroke-width="3" opacity="0.65"/>
    <path d="M 520 80 C 505 165, 465 225, 418 255" stroke="url(#lineGradRight)" stroke-width="3.5" opacity="0.85"/>
    <path d="M 460 70 C 452 150, 430 215, 410 255" stroke="url(#lineGradRight)" stroke-width="4"/>
  </g>

  <!-- Infalling Energy Orbs / Quantum Packets -->
  <circle cx="205" cy="155" r="4" fill="#89DCEB" opacity="0.8"/>
  <circle cx="260" cy="180" r="5" fill="#A6E3A1" opacity="0.9"/>
  <circle cx="320" cy="205" r="5.5" fill="#F9E2AF"/>
  <circle cx="595" cy="155" r="4" fill="#94E2D5" opacity="0.8"/>
  <circle cx="540" cy="180" r="5" fill="#89B4FA" opacity="0.9"/>
  <circle cx="480" cy="205" r="5.5" fill="#CBA6F7"/>

  <!-- Celestial Gravitational Core (The Event Horizon Well) -->
  <g filter="url(#subtleShadow)">
    <!-- Accretion Orbit Ring (Back half) -->
    <path d="M 285 245 A 115 32 0 0 1 515 245" fill="none" stroke="url(#orbitGrad)" stroke-width="3" opacity="0.4"/>
    
    <!-- Central Core Sphere -->
    <circle cx="400" cy="245" r="58" fill="url(#corePlanet)" filter="url(#softGlow)"/>

    <!-- Soft Inner Shadow Crescent -->
    <path d="M 345 245 A 55 55 0 0 0 442 278 A 54 54 0 0 1 345 245" fill="#585B70" opacity="0.32"/>

    <!-- Delicate Inner Core Highlight -->
    <ellipse cx="382" cy="225" rx="20" ry="13" fill="#FFFFFF" opacity="0.45" transform="rotate(-25 382 225)"/>

    <!-- Accretion Orbit Ring (Front half, passing in front of core) -->
    <path d="M 515 245 A 115 32 0 0 1 285 245" fill="none" stroke="url(#orbitGrad)" stroke-width="3.5" opacity="0.85"/>
  </g>

  <!-- Orbit Particles -->
  <circle cx="510" cy="245" r="3.5" fill="#CBA6F7"/>
  <circle cx="290" cy="245" r="3" fill="#89DCEB"/>

  <!-- Gravitational Wave Ripples Descending Below -->
  <g opacity="0.45" fill="none" stroke-linecap="round">
    <path d="M 330 330 C 370 348, 430 348, 470 330" stroke="#FAB387" stroke-width="2.5"/>
    <path d="M 305 355 C 360 378, 440 378, 495 355" stroke="#F38BA8" stroke-width="2"/>
    <path d="M 285 380 C 350 408, 450 408, 515 380" stroke="#CBA6F7" stroke-width="1.5" stroke-dasharray="4 6"/>
  </g>

  <!-- Typography: GravityVM Branding -->
  <g text-anchor="middle">
    <!-- Title -->
    <text x="400" y="475" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="52" font-weight="700" letter-spacing="3" fill="url(#textGrad)">
      Gravity<tspan font-weight="300" fill="#CDD6F4">VM</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="400" y="515" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="400" letter-spacing="5" fill="#A6ADC8" opacity="0.9">
      NEXT-GEN BACKEND COMPILER &amp; RUNTIME
    </text>

    <!-- Micro Metadata Chips -->
    <g transform="translate(400, 545)">
      <text x="0" y="0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" letter-spacing="1.5" fill="#6C7086">
        NATIVE x86_64 / AARCH64  •  C  •  LUA  •  PYTHON  •  JS
      </text>
    </g>
  </g>
</svg>

