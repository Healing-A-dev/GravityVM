<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="iconBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#282637"/>
      <stop offset="60%" stop-color="#1B1926"/>
      <stop offset="100%" stop-color="#14121E"/>
    </radialGradient>

    <radialGradient id="corePlanet" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="25%" stop-color="#F5C2E7"/>
      <stop offset="65%" stop-color="#CBA6F7"/>
      <stop offset="100%" stop-color="#897EC4"/>
    </radialGradient>

    <linearGradient id="lineGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89DCEB" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#A6E3A1" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#F9E2AF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FAB387" stop-opacity="1.0"/>
    </linearGradient>

    <linearGradient id="lineGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94E2D5" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#89B4FA" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#CBA6F7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5C2E7" stop-opacity="1.0"/>
    </linearGradient>

    <linearGradient id="orbitGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#89DCEB" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#B4BEFE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#CBA6F7" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0E0C17" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#iconBg)"/>

  <!-- Spacetime Curvature Funnel Rings -->
  <g opacity="0.32">
    <ellipse cx="256" cy="180" rx="190" ry="32" fill="none" stroke="#74C7EC" stroke-width="2" stroke-dasharray="4 6"/>
    <ellipse cx="256" cy="215" rx="150" ry="24" fill="none" stroke="#A6E3A1" stroke-width="2"/>
    <ellipse cx="256" cy="245" rx="105" ry="16" fill="none" stroke="#F9E2AF" stroke-width="2"/>
  </g>

  <!-- Infalling Curvature Geodesics -->
  <g fill="none" stroke-linecap="round">
    <path d="M 85 155 C 105 220, 165 260, 225 272" stroke="url(#lineGradLeft)" stroke-width="3" opacity="0.5"/>
    <path d="M 135 125 C 160 205, 195 250, 235 274" stroke="url(#lineGradLeft)" stroke-width="3.5" opacity="0.75"/>
    <path d="M 195 105 C 210 190, 230 245, 245 275" stroke="url(#lineGradLeft)" stroke-width="4.5"/>

    <path d="M 427 155 C 407 220, 347 260, 287 272" stroke="url(#lineGradRight)" stroke-width="3" opacity="0.5"/>
    <path d="M 377 125 C 352 205, 317 250, 277 274" stroke="url(#lineGradRight)" stroke-width="3.5" opacity="0.75"/>
    <path d="M 317 105 C 302 190, 282 245, 267 275" stroke="url(#lineGradRight)" stroke-width="4.5"/>
  </g>

  <!-- Gravity Core Sphere & Accretion Ring -->
  <g filter="url(#subtleShadow)">
    <path d="M 146 268 A 110 30 0 0 1 366 268" fill="none" stroke="url(#orbitGrad)" stroke-width="3.5" opacity="0.4"/>
    <circle cx="256" cy="268" r="64" fill="url(#corePlanet)" filter="url(#softGlow)"/>
    <path d="M 195 268 A 61 61 0 0 0 302 305 A 60 60 0 0 1 195 268" fill="#585B70" opacity="0.3"/>
    <ellipse cx="236" cy="246" rx="22" ry="14" fill="#FFFFFF" opacity="0.45" transform="rotate(-25 236 246)"/>
    <path d="M 366 268 A 110 30 0 0 1 146 268" fill="none" stroke="url(#orbitGrad)" stroke-width="4" opacity="0.85"/>
  </g>

  <!-- Gravitational Wave Ripples -->
  <g opacity="0.45" fill="none" stroke-linecap="round">
    <path d="M 190 355 C 230 375, 282 375, 322 355" stroke="#FAB387" stroke-width="3"/>
    <path d="M 165 385 C 220 410, 292 410, 347 385" stroke="#F38BA8" stroke-width="2.5"/>
    <path d="M 145 415 C 215 442, 297 442, 367 415" stroke="#CBA6F7" stroke-width="2" stroke-dasharray="4 6"/>
  </g>
</svg>

